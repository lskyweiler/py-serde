# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  APP_VERSION:
    sh: cat VERSION

tasks:
  default:
    cmds:
      - task: build-dev

  build-dev:
    desc: Build a dev build
    cmds:
      - uv run --dev maturin dev -r

  gen-stubs:
    desc: Generate python stub file
    cmds:
      - cargo run stub_gen

  test:
    desc: Run all rust and python unit tests
    deps: [build-dev]
    cmds:
      - uv run pytest .
      - cargo test