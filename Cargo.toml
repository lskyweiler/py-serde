[package]
name = "py-unpack"
authors = ["Lucas Weiler <lucas.l.weiler@leidos.com>"]
version = "0.1.1"
edition = "2024"
description = "Generic python object deserialization written in rust"
keywords = ["deserialization", "utilities"]
license-file = "LICENSE"
homepage = "https://github.com/lskyweiler/unpack"
repository = "https://github.com/lskyweiler/unpack"
readme = "README.md"

# Name differs from python-side to be more explict in rust
[lib]
name = "py_unpack"
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
pyo3 = { version = "~0.27", features = ["generate-import-lib"] }
pyo3-stub-gen = { version = "~0.19", default-features = false }
env_logger = "~0.11"                                             # for stub gens
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"

[profile.release]
# https://github.com/johnthagen/min-sized-rust
strip = true # Automatically strip symbols from the binary.

[features]
# extension-module makes running the embedded rust python tests difficult since it doesn't link to libpython
default = ["pyo3/extension-module", "build-py-lib"]
test = ["pyo3/auto-initialize"]
# Optinally turn off building a python module. Use this if you will bundle this crate into your rust app
build-py-lib = []
